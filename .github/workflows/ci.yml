name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The plugin has no dependencies and no build step: nothing to install.
      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js

      - name: Unit and API tests
        run: node --test tests/unit.test.js tests/api.test.js
